<!-- IF S_AIREPLY_BOTS -->
<div class="aireply-botbar">
	<span class="aireply-botbar-label">{L_AIREPLY_BOTS_HINT}</span>
	<!-- BEGIN aireply_available_bots -->
		<button type="button" class="button button-secondary aireply-botpick"
			data-aireply-name="{aireply_available_bots.USERNAME}">@{aireply_available_bots.LABEL}</button>
	<!-- END aireply_available_bots -->
</div>

<script>
(function () {
	'use strict';

	/*
	 * Si inserisce "@Nome" in chiaro e non il BBCode delle menzioni.
	 *
	 * Il BBCode renderebbe un collegamento più curato, ma comparirebbe grezzo
	 * nell'area di scrittura — [smention u=2]Gemini[/smention] in mezzo a una
	 * frase — e non tutte le board hanno un'estensione di menzione installata.
	 *
	 * "@Nome" funziona ovunque, si legge mentre si scrive, e il rilevamento di
	 * AI Reply lo riconosce fra i formati accettati.
	 */
	function insertAt(area, text) {
		var start = area.selectionStart;
		var end = area.selectionEnd;
		var value = area.value;

		// Uno spazio prima, se non c'è già e non siamo a inizio riga.
		var before = value.slice(0, start);
		var pad = (before === '' || /[\s\n]$/.test(before)) ? '' : ' ';

		area.value = before + pad + text + ' ' + value.slice(end);

		var pos = start + pad.length + text.length + 1;
		area.selectionStart = area.selectionEnd = pos;
		area.focus();
	}

	document.addEventListener('click', function (e) {
		var button = e.target.closest ? e.target.closest('.aireply-botpick') : null;

		if (!button) { return; }

		var name = button.getAttribute('data-aireply-name');
		var area = document.getElementById('message')
			|| document.querySelector('textarea[name=message]');

		if (name && area) { insertAt(area, '@' + name); }
	});
})();
</script>
<!-- ENDIF -->
